<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Modelos</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Import model-viewer web component from Google CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body.page-modelos {
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 16px 50px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .modelos-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .modelos-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 8px;
    }

    .modelos-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 28px;
      box-shadow: var(--glass-shadow);
      box-sizing: border-box;
    }

    .form-group-item {
      margin-bottom: 18px;
    }

    .form-group-item:last-child {
      margin-bottom: 0;
    }

    .drag-drop-zone {
      border: 2px dashed #c084fc;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .drag-drop-zone:hover, .drag-drop-zone.dragover {
      border-color: var(--primary-purple);
      background: rgba(243, 232, 255, 0.85);
      transform: translateY(-2px);
    }

    .drag-drop-icon {
      color: var(--primary-purple);
      width: 40px;
      height: 40px;
    }

    .drag-drop-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .drag-drop-files-list {
      font-size: 0.85rem;
      color: var(--primary-purple);
      font-weight: 600;
      word-break: break-all;
    }

    .btn-submit-companion {
      width: 100%;
      padding: 14px 20px;
      border-radius: 20px;
      border: none;
      background: var(--primary-purple);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit-companion:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(147, 51, 234, 0.4);
    }

    .btn-submit-companion:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .models-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .model-card-item {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.25s ease;
    }

    .model-card-item:hover {
      transform: translateY(-3px);
    }

    .model-card-item.active {
      border: 2px solid var(--primary-purple);
    }

    .model-viewer-box {
      width: 100%;
      height: 240px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.6);
      position: relative;
    }

    .model-viewer-box model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .model-card-actions {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .btn-card-select {
      flex: 1;
      padding: 10px 14px;
      border-radius: 14px;
      border: none;
      background: var(--primary-purple);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-card-select:hover {
      background: var(--primary-hover);
    }

    .model-card-item.active .btn-card-select {
      background: #10b981;
    }

    .btn-card-delete {
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid #fecdd3;
      background: #ffe4e6;
      color: #e11d48;
      font-weight: 700;
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-card-delete:hover {
      background: #fecdd3;
    }
  </style>
</head>
<body class="page-modelos">

  <div class="modelos-container">
    <nav class="modelos-nav">
      <a href="./index.html" class="btn-icon" title="Volver al Inicio" aria-label="Volver al Inicio">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </a>
    </nav>

    <!-- Upload Form -->
    <div class="modelos-card">
      <form id="form-upload-companion">
        <div class="form-group-item">
          <input type="text" id="companion-name" class="form-input" placeholder="Nombre del modelo..." required autocomplete="off">
        </div>

        <!-- Model Files Drag & Drop Zone -->
        <div class="form-group-item">
          <div id="drop-zone-model" class="drag-drop-zone">
            <svg class="drag-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <div class="drag-drop-text">
              Arrastra o selecciona el modelo (.gltf, .glb)
            </div>
            <div id="model-files-list" class="drag-drop-files-list"></div>
            <input type="file" id="input-model-files" multiple accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.webp" style="display: none;">
          </div>
        </div>

        <button type="submit" id="btn-save-companion" class="btn-submit-companion">
          Cargar Modelo
        </button>
      </form>
    </div>

    <!-- Models List -->
    <div id="saved-companions-grid" class="models-grid">
      <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 40px 20px;">
        Cargando...
      </div>
    </div>
  </div>

  <script type="module" src="./js/modelos.js"></script>
</body>
</html>
