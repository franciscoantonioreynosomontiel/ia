<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Subir y Gestionar Modelos - Toto AI</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Import model-viewer web component from Google CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    .modelos-page {
      min-height: 100vh;
      background: radial-gradient(circle at top center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      padding-bottom: 50px;
    }

    .modelos-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
    }

    .modelos-header h1 {
      font-size: 1.3rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0;
    }

    .btn-header-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
      transition: all 0.2s ease;
    }

    .btn-header-back:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .modelos-container {
      max-width: 800px;
      margin: 30px auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    /* Modal / Form Styling Matching Provided Image */
    .upload-card-modal {
      background: rgba(23, 32, 51, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      margin-bottom: 40px;
      position: relative;
    }

    .modal-title-heading {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .tab-pills-container {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }

    .tab-pill-btn {
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(30, 41, 59, 0.8);
      color: #94a3b8;
      transition: all 0.25s ease;
    }

    .tab-pill-btn.active {
      background: #06b6d4;
      color: #0f172a;
      border-color: #06b6d4;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .form-group-item {
      margin-bottom: 22px;
    }

    .form-group-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .form-text-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .form-text-input:focus {
      border-color: #06b6d4;
    }

    /* Drag and Drop Zone */
    .drag-drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      background: rgba(15, 23, 42, 0.4);
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      position: relative;
    }

    .drag-drop-zone:hover, .drag-drop-zone.dragover {
      border-color: #06b6d4;
      background: rgba(6, 182, 212, 0.08);
    }

    .drag-drop-icon {
      color: #06b6d4;
      width: 44px;
      height: 44px;
    }

    .drag-drop-text {
      font-size: 0.82rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.4;
      max-width: 90%;
    }

    .drag-drop-files-list {
      font-size: 0.85rem;
      color: #38bdf8;
      font-weight: 600;
      margin-top: 6px;
      word-break: break-all;
    }

    .btn-submit-companion {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 10px;
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-submit-companion:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
    }

    .btn-submit-companion:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Voice Config Tab */
    .voice-test-row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn-test-voice {
      padding: 12px 18px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-test-voice:hover {
      background: rgba(56, 189, 248, 0.25);
    }

    /* Saved Companions Section */
    .saved-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .saved-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .companion-card-saved {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .companion-preview-box {
      width: 100%;
      height: 180px;
      background: #0f172a;
      border-radius: 12px;
      overflow: hidden;
    }

    .companion-preview-box model-viewer {
      width: 100%;
      height: 100%;
    }

    .btn-delete-companion {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete-companion:hover {
      background: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>

  <div class="modelos-page">
    <header class="modelos-header">
      <h1>Modelos y Compañeros 3D</h1>
      <a href="./asistente.html" class="btn-header-back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Volver a Selección
      </a>
    </header>

    <main class="modelos-container">
      <!-- Upload Card Modal -->
      <div class="upload-card-modal">
        <h2 class="modal-title-heading">Subir Nuevo Compañero</h2>

        <!-- Tab Pills -->
        <div class="tab-pills-container">
          <button id="tab-btn-modelo" class="tab-pill-btn active" type="button">Modelo</button>
          <button id="tab-btn-config" class="tab-pill-btn" type="button">Configuración</button>
        </div>

        <form id="form-upload-companion">
          <!-- TAB 1: MODELO -->
          <div id="tab-content-modelo">
            <div class="form-group-item">
              <label class="form-group-label" for="companion-name">Nombre del Compañero</label>
              <input type="text" id="companion-name" class="form-text-input" placeholder="Ej: Pikachu" required autocomplete="off">
            </div>

            <!-- Model Files Drag & Drop Zone -->
            <div class="form-group-item">
              <label class="form-group-label">Archivos del Modelo (.gltf, .glb, .bin, texturas)</label>
              <div id="drop-zone-model" class="drag-drop-zone">
                <svg class="drag-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M175 115 120 60 65 115"></path><path d="M4 14.89 4.26 15.2A7 7 0 0 0 9.8 18h10.4a7 7 0 0 0 5.54-2.8L26 14.89"></path><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 0 0 2 13.5a4.5 4.5 0 0 0 4.5 4.5"></path><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line></svg>
                <div class="drag-drop-text">
                  Arrastra todos los archivos del modelo (.gltf, .glb, .bin, texturas) aquí o haz clic para seleccionar
                </div>
                <div id="model-files-list" class="drag-drop-files-list"></div>
                <input type="file" id="input-model-files" multiple accept=".gltf,.glb,.bin,.png,.jpg,.jpeg,.webp" style="display: none;">
              </div>
            </div>

            <!-- Poster Image Drag & Drop Zone -->
            <div class="form-group-item">
              <label class="form-group-label">Poster del Compañero (Imagen que sale mientras carga)</label>
              <div id="drop-zone-poster" class="drag-drop-zone">
                <svg class="drag-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                <div class="drag-drop-text">
                  Arrastra un poster aquí o haz clic para subir
                </div>
                <div id="poster-file-list" class="drag-drop-files-list"></div>
                <input type="file" id="input-poster-file" accept="image/*" style="display: none;">
              </div>
            </div>
          </div>

          <!-- TAB 2: CONFIGURACION -->
          <div id="tab-content-config" style="display: none;">
            <div class="form-group-item">
              <label class="form-group-label" for="companion-voice-select">Voz de ElevenLabs para este Compañero</label>
              <select id="companion-voice-select" class="form-text-input">
                <option value="">Cargando voces de ElevenLabs...</option>
              </select>
            </div>

            <div class="form-group-item">
              <label class="form-group-label" for="companion-voice-custom">O ingresa un Voice ID de ElevenLabs personalizado</label>
              <input type="text" id="companion-voice-custom" class="form-text-input" placeholder="Ej: 21m00Tcm4TlvDq8ikWAM" autocomplete="off">
            </div>

            <div class="voice-test-row">
              <button id="btn-test-companion-voice" type="button" class="btn-test-voice">
                🔊 Probar Voz
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" id="btn-save-companion" class="btn-submit-companion">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Guardar Compañero
          </button>
        </form>
      </div>

      <!-- Saved Companions List -->
      <section>
        <div class="saved-title">
          <span>Compañeros Guardados</span>
        </div>
        <div id="saved-companions-grid" class="saved-grid">
          <div style="color: #94a3b8; font-size: 0.9rem;">Cargando modelos guardados...</div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/modelos.js"></script>
</body>
</html>
