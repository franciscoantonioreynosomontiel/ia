<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Toto</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Import model-viewer web component from Google CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body.page-asistente {
      height: auto;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    .asistente-top-bar {
      width: 100%;
      max-width: 1200px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 20px;
    }

    .asistente-grid {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      box-sizing: border-box;
    }

    .assistant-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      box-sizing: border-box;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .assistant-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 36px rgba(147, 51, 234, 0.16);
    }

    .assistant-card.active {
      border: 2px solid var(--primary-purple);
      box-shadow: 0 0 25px rgba(147, 51, 234, 0.25);
    }

    .model-viewer-wrapper {
      width: 100%;
      height: 300px;
      border-radius: 20px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.5);
      position: relative;
    }

    .model-viewer-wrapper model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .btn-select-assistant {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 20px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s ease;
      background: var(--primary-purple);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(147, 51, 234, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-select-assistant:hover {
      background: var(--primary-hover);
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(147, 51, 234, 0.35);
    }

    .assistant-card.active .btn-select-assistant {
      background: #10b981;
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3);
    }

    .loading-spinner {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
      font-size: 1.05rem;
      font-weight: 500;
    }
  </style>
</head>
<body class="page-asistente">

  <nav class="asistente-top-bar">
    <a href="./index.html" class="btn-icon" title="Volver al Inicio" aria-label="Volver al Inicio">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
    </a>
  </nav>

  <main id="assistants-grid" class="asistente-grid">
    <div class="loading-spinner">
      Cargando...
    </div>
  </main>

  <script type="module" src="./js/asistente.js"></script>
</body>
</html>
