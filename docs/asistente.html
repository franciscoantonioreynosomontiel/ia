<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Elige tu Asistente - Toto AI</title>
  <link rel="icon" type="image/png" href="./assets/img/logopwa.png">
  <link rel="apple-touch-icon" href="./assets/img/logopwa.png">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#8B5CF6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">

  <!-- Import model-viewer web component from Google CDN -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    .asistente-page {
      min-height: 100vh;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }

    .asistente-header {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
    }

    .asistente-title-box h1 {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #a7f3d0 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .asistente-title-box p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin: 2px 0 0 0;
    }

    .asistente-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-header-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #f8fafc;
    }

    .btn-header-action:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-header-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: none;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .asistente-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px;
      width: 100%;
      box-sizing: border-box;
    }

    .asistente-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }

    .assistant-card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .assistant-card:hover {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 20px 30px -10px rgba(56, 189, 248, 0.25);
    }

    .assistant-card.active {
      border: 2px solid #38bdf8;
      background: rgba(30, 58, 138, 0.3);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
    }

    .active-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 10;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.5);
    }

    .model-viewer-wrapper {
      width: 100%;
      height: 260px;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, rgba(15, 23, 42, 0.4) 100%);
      position: relative;
      user-select: none;
    }

    .model-viewer-wrapper model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .assistant-card-body {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
      gap: 14px;
    }

    .assistant-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: #f1f5f9;
      margin: 0;
    }

    .assistant-voice-info {
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.5);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .btn-select-assistant {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
    }

    .btn-select-assistant:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    .assistant-card.active .btn-select-assistant {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .loading-spinner {
      text-align: center;
      padding: 60px 20px;
      color: #94a3b8;
      font-size: 1rem;
    }

    @media (max-width: 640px) {
      .asistente-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .asistente-actions {
        width: 100%;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="asistente-page">
    <!-- Header -->
    <header class="asistente-header">
      <div class="asistente-title-box">
        <h1>Elige tu Asistente 3D</h1>
        <p>Selecciona la personalidad y voz que te acompañará</p>
      </div>

      <div class="asistente-actions">
        <a href="./modelos.html" class="btn-header-action" title="Administrar y Subir Compañeros">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Subir / Gestionar
        </a>
        <a href="./index.html" id="btn-go-main" class="btn-header-action btn-header-primary">
          Ir al Inicio
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="asistente-container">
      <div id="assistants-grid" class="asistente-grid">
        <div class="loading-spinner">
          Cargando asistentes disponibles...
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./js/asistente.js"></script>
</body>
</html>
